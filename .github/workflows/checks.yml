# Runs every test and check on each pull request and on main.
# It has no AWS credentials and read-only access to the repo, so it can't
# change anything. Plan, apply and the frontend upload come with M4.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Parity tests skip here: the reference photos are never committed.
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3.13 matches the Lambda runtime.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt
      - run: pip install pytest boto3 -r backend/api/requirements.txt
      - run: python -m pytest -q
        working-directory: backend/scoring
      - run: python -m pytest -q
        working-directory: backend/api
      - run: python -m pytest -q
        working-directory: backend/kill_switch

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive infra
      # -backend=false: no state and no AWS access, only the providers' schemas.
      - name: terraform validate
        run: |
          for root in guardrails data app; do
            echo "::group::$root"
            terraform -chdir=infra/$root init -backend=false -input=false
            terraform -chdir=infra/$root validate
            echo "::endgroup::"
          done
